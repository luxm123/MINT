aws:
  region: us-east-1
  lambda_functions:
    f1: mint-f1
    f2: mint-f2
    f3: mint-f3
    f4: mint-f4
    f5: mint-f5
    f6: mint-f6
    f7: mint-f7
    f8: mint-f8
    f9: mint-f9

experiment:
  # This timing profile is calibrated only for deterministic local lifecycle
  # validation. A real AWS smoke test must use a separately calibrated config.
  local_only: true
  dag: adaptive_branch
  baseline: mint_markov_full
  repetitions: 20
  warmup_budget: 2
  # The intent-maintenance ablation is defined as one immediate warmup plus
  # one reserved pending intent.  Keep this explicit so all three variants
  # start from the same B=2 budget decomposition.
  adaptive_initial_warmup_budget: 1
  # All compared strategies use the same candidate set. The entry f1 is the
  # observation point and is therefore excluded from predictive warmup.
  exclude_entry_nodes_from_warmup: true
  # Intent stays genuinely pending while f1 runs. Branch revelation may
  # cancel/replace it before this timer submits the Lambda warmup.
  adaptive_pending_delay_sec: 0.05
  # Reserve an explicit pre-arrival window for the one immediate warmup.
  # This value is for local lifecycle validation only; AWS must be calibrated
  # separately from measured Lambda timing.
  warmup_lead_sec: 0.2
  dry_run: true
  # Decision-audit pilot: prevent controller heat from suppressing later
  # prediction/replanning events. This is not an AWS cold-start mechanism.
  reset_runtime_state_each_run: true
  output_dir: results/adaptive_local_pilot
  branch_seed: 20260804
  branch_probability_phases:
    - start: 0
      end: 10
      probabilities: {f2: 0.8, f3: 0.0666667, f4: 0.0666667, f5: 0.0666666}
    - start: 10
      end: 20
      probabilities: {f2: 0.0666667, f3: 0.0666667, f4: 0.0666666, f5: 0.8}

planner:
  type: markov
  horizon: 5
  warmup_cost: 0.1
  cold_start_penalty_weight: 1.0
  wasted_warmup_penalty_weight: 0.2
  missed_warmup_penalty_weight: 0.5
  retention_bucket_sec: 60
  branch_prior_alpha: 0.0
  branch_history_window: 10
  historical_branch_records:
    - f2
    - f2
    - f2
    - f2
    - f2
    - f2
    - f2
    - f3
    - f4
    - f5

platform:
  default_retention_sec: 300
  default_cold_start_ms: 800
  default_warm_duration_ms: 100

scheduler:
  enable_delay: true
  enable_cancel: true
  enable_replace: true
  gain_threshold: 0.0
