aws:
  region: us-east-1
  lambda_functions:
    f1: mint-f1
    f2: mint-f2
    f3: mint-f3
    f4: mint-f4
    f5: mint-f5

experiment:
  dag: chain
  baseline: mint_full
  repetitions: 3
  warmup_budget: 2
  dry_run: true
  output_dir: results/default

planner:
  # type can be heuristic or markov. Heuristic remains the lightweight prototype;
  # markov enables the finite-horizon offline policy analyzer.
  type: markov
  horizon: 5
  warmup_cost: 0.1
  cold_start_penalty_weight: 1.0
  wasted_warmup_penalty_weight: 0.2
  missed_warmup_penalty_weight: 0.5
  retention_bucket_sec: 60

platform:
  retention_probe_delays_sec: [30, 60, 120, 180, 300, 600]
  default_retention_sec: 300
  default_cold_start_ms: 800
  default_warm_duration_ms: 100

scheduler:
  enable_delay: true
  enable_cancel: true
  enable_replace: true
  gain_threshold: 0.0
